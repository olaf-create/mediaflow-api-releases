name: release

on:
  workflow_dispatch:
    inputs:
      ref:
        # No default on purpose: the release tag below is taken straight from this
        # input, so dispatching without a value used to build 'main' and publish a
        # release tagged after the branch. Must be an explicit version tag.
        description: 'Version tag in the source repo to build — must be vX.Y.Z (or vX.Y.Z-suffix with prerelease)'
        required: true
      prerelease:
        # Publishes the release as a GitHub pre-release. GitHub's
        # `releases/latest` excludes pre-releases, so the stable update channel
        # never sees it; only clients that opted into the pre-release channel
        # will be offered it. The tag MUST carry a semver suffix (-beta.1), so
        # that a later stable release of the same version keeps its clean tag
        # and so that semver ranks the pre-release below it.
        description: 'Publish as pre-release (tag must be vX.Y.Z-suffix)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Cheap gate in front of the macOS/Windows matrix: a wrong ref fails in seconds
  # instead of producing a release named after a branch.
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require a version tag
        # Input goes through the environment, never interpolated into the script —
        # otherwise the value could break out of the shell command.
        env:
          REF: ${{ github.event.inputs.ref }}
          PRE: ${{ inputs.prerelease }}
        run: |
          if [ "$PRE" = "true" ]; then
            # A pre-release must be tagged with a suffix: semver then ranks it
            # below the stable version of the same number, and the clean tag
            # stays free for the eventual stable release.
            if [[ ! "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.]+$ ]]; then
              echo "::error::A pre-release needs a suffixed tag such as v0.1.196-beta.1, got '$REF'."
              exit 1
            fi
          else
            if [[ ! "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Refusing to build '$REF'. The release is tagged with this exact value, so a branch name would publish a release named after the branch. Pass a version tag such as v0.1.128 (or set prerelease for a suffixed tag)."
              exit 1
            fi
          fi
          echo "Building $REF (prerelease: $PRE)"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout private source
        uses: actions/checkout@v5
        with:
          repository: olaf-create/mediaflow-api-explorer
          ref: ${{ github.event.inputs.ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      # Match the npm version the lockfile was generated with (Node 22 ships
      # npm 10, which resolves Storybook's React 18 peer deps differently and
      # rejects the lock). Same fix as .github/workflows/docs.yml in the source.
      - run: npm i -g npm@11

      - name: Install frontend deps
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # publishes the release into THIS public repo
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing + notarization. Empty until the Apple secrets are
          # set → the build is simply unsigned (current behaviour). Once all are
          # present, tauri-action imports the cert and notarizes automatically.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.event.inputs.ref }}
          releaseName: 'Mediaflow API ${{ github.event.inputs.ref }}'
          releaseDraft: false
          prerelease: ${{ inputs.prerelease }}
          args: ${{ matrix.args }}

  # The six PDF manuals, attached to the release.
  #
  # The manual website links them at
  # `releases/latest/download/Mediaflow-Handbuch-<lang>.pdf`; without this job
  # six links in its header point at nothing.
  #
  # `needs: build` because that is where the release comes into existence
  # (tauri-action creates it) — before that there is nothing to attach to. The
  # other way round this job gates NOTHING: `verify` and `prune` still hang off
  # the build alone. A failed PDF is a dead link on a website, a failed
  # installer is a broken release; the two must not hold each other up.
  #
  # The script in the source repo DRIVES THE APP instead of rebuilding the PDF:
  # jsPDF needs `canvas`, and the figures come from Vite's pipeline. It starts
  # its own dev server, so all this job adds is Playwright.
  handbuch-pdf:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v5
        with:
          repository: olaf-create/mediaflow-api-explorer
          ref: ${{ github.event.inputs.ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Same npm as the build job: the lockfile was generated with it and npm 10
      # rejects the lock.
      - run: npm i -g npm@11

      - name: Install frontend deps
        run: npm ci

      # `--with-deps` pulls the system libraries a bare runner lacks. Chromium
      # only: a PDF needs no second engine.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build the six manuals
        run: npm run gen:handbuch-pdf

      # Through `gh`, like every other step here, rather than one more foreign
      # action. `--clobber` makes a re-run possible without name collisions.
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.ref }}
        run: |
          set -euo pipefail
          count=$(ls -1 dist-pdf/*.pdf | wc -l | tr -d ' ')
          if [ "$count" -ne 6 ]; then
            echo "::error::Expected 6 manuals, found $count in dist-pdf/."
            exit 1
          fi
          gh release upload "$TAG" dist-pdf/*.pdf --repo "$REPO" --clobber
          echo "Attached $count manuals to $TAG:"
          ls -lh dist-pdf/*.pdf | awk '{print "  - " $9 "  " $5}'

  # Guard against a *partial* release. The matrix runs with fail-fast: false so a
  # platform outage cannot kill the other build — but that also means one job can
  # publish the release on its own, leaving latest.json without the other
  # platform's entry. The updater then silently serves nothing to those users
  # (exactly what happened in v0.1.146, when the Windows runner died during
  # provisioning and only macOS shipped).
  #
  # `if: always()` is the whole point: with a plain `needs: build` this job would
  # be skipped by the very failure it is meant to report.
  verify:
    needs: [validate, build]
    if: always() && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: latest.json must carry every platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.ref }}
        run: |
          set -euo pipefail
          EXPECTED="darwin-aarch64 darwin-aarch64-app windows-x86_64 windows-x86_64-nsis"

          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::No release was published for $TAG."
            exit 1
          fi

          tmp=$(mktemp -d)
          gh release download "$TAG" --repo "$REPO" --pattern latest.json --dir "$tmp"

          version=$(jq -r '.version' "$tmp/latest.json")
          want="${TAG#v}"
          if [ "$version" != "$want" ]; then
            echo "::error::latest.json reports $version but the tag is $TAG."
            exit 1
          fi

          # A platform counts as served only with BOTH a url and a signature —
          # the updater rejects an unsigned entry, so a half-written one is as
          # broken as a missing one.
          missing=""
          for p in $EXPECTED; do
            if ! jq -e --arg p "$p" '.platforms[$p].url // empty' "$tmp/latest.json" >/dev/null 2>&1 \
               || ! jq -e --arg p "$p" '.platforms[$p].signature // empty' "$tmp/latest.json" >/dev/null 2>&1; then
              missing="$missing $p"
            fi
          done

          if [ -n "$missing" ]; then
            echo "Platforms present in latest.json:"
            jq -r '.platforms | keys[]' "$tmp/latest.json" | sed 's/^/  - /'
            echo "::error::latest.json is missing:$missing — the updater would serve nothing to those users. Re-run the failed build job, then re-run this workflow's checks."
            exit 1
          fi

          echo "latest.json v$version carries all expected platforms:"
          jq -r '.platforms | keys[]' "$tmp/latest.json" | sed 's/^/  - /'

  # Keep the public release list to just the version that was built. Every ship
  # otherwise adds ~100 MB of publicly downloadable installers, and the tidy-up
  # was manual — which meant it did not happen.
  #
  # Drafting is reversible: a release set to draft keeps its assets and can be
  # published again with one click. Auto-update is unaffected, because the updater
  # always resolves `releases/latest`, never a specific old version.
  prune:
    # Only after `verify`: if this release is incomplete, the previous one must
    # stay public as a working fallback instead of being drafted away.
    needs: [build, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Draft every older app release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          KEEP: ${{ github.event.inputs.ref }}
          PRE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          # Only tags shaped like app versions are touched. That alone excludes the
          # `licence-blocklist` release, whose asset the app fetches at a fixed
          # tag — drafting it would make revoked.txt unreachable, and because the
          # app treats an unreachable list as "no revocations", licence revocation
          # would silently stop working. The explicit guard below says so twice on
          # purpose: this is the one release that must never be swept up here.
          # Plain string plus while-read rather than mapfile: mapfile needs bash 4,
          # which keeps this step from being testable on a stock macOS shell.
          # A pre-release run drafts only OTHER pre-releases: the stable
          # release must stay public, it is the working fallback and the whole
          # stable channel. A stable run drafts old stables AND every
          # pre-release — once the stable is out, the previews are history.
          if [ "$PRE" = "true" ]; then
            pattern='^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.]+$'
          else
            pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          fi
          stale=$(
            gh api "repos/$REPO/releases?per_page=100" \
              --jq '.[] | select(.draft == false) | .tag_name' \
              | grep -E "$pattern" \
              | grep -vx "$KEEP" || true
          )

          if [ -z "$stale" ]; then
            echo "Nothing to draft — $KEEP is already the only public app release."
            exit 0
          fi

          echo "$stale" | while IFS= read -r tag; do
            if [ "$tag" = "licence-blocklist" ]; then
              echo "::error::Refusing to draft the blocklist release."
              exit 1
            fi
            id=$(gh api "repos/$REPO/releases/tags/$tag" --jq .id)
            # -F sends a typed boolean; -f would send the string "true", which the
            # API accepts and then ignores, leaving the release public.
            state=$(gh api -X PATCH "repos/$REPO/releases/$id" -F draft=true --jq .draft)
            if [ "$state" != "true" ]; then
              echo "::error::$tag is still public after the request."
              exit 1
            fi
            echo "drafted $tag"
          done

          echo "Public app releases now: $KEEP (plus the blocklist)."
          gh release list --repo "$REPO" --exclude-drafts
